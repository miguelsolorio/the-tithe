<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materials test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050404;
        color: #cbbfa8;
        font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      canvas#view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, 0);
        color: #e4d8bc;
        text-shadow: 0 0 3px #000, 0 0 2px #000, 0 0 1px #000;
        white-space: nowrap;
      }
      #panel {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid #2a2018;
        padding: 6px 8px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        min-width: 220px;
      }
      #panel.min {
        display: none;
      }
      #panel a {
        color: #e08a2c;
        margin-right: 6px;
      }
      #panel select {
        background: #111;
        color: #ddd;
        border: 1px solid #333;
        font: inherit;
      }
      #times td {
        padding: 0 6px 0 0;
      }
      #times td.ms {
        text-align: right;
        color: #d8ccb0;
      }
      #times tr.slow td.ms {
        color: #ff7a50;
      }
      #hint {
        position: absolute;
        bottom: 8px;
        left: 8px;
        color: #7d705c;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="labels"></div>
    <div id="panel">
      <div id="nav"></div>
      <div id="times"></div>
    </div>
    <div id="hint">drag: orbit · wheel: zoom · L: lights · H: hide panel</div>
    <script type="module" src="./materials.js"></script>
  </body>
</html>
